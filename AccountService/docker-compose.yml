version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: account_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: accountdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  accountservice:
    build:
      context: .
      dockerfile: AccountService/Dockerfile
    container_name: account_api
    ports:
      - "80:80"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=accountdb;Username=postgres;Password=postgres
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data: